
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkadyuti Hierarchy Builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      color: #e8e8e8;
      margin-bottom: 10px;
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    .input-section {
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 12px;
      color: #c0c0c0;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    textarea {
      width: 100%;
      padding: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: vertical;
      min-height: 140px;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      background: rgba(255, 255, 255, 0.03);
      color: #e8e8e8;
      backdrop-filter: blur(10px);
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    textarea:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(100, 200, 255, 0.2), inset 0 0 20px rgba(100, 200, 255, 0.05);
      background: rgba(100, 200, 255, 0.02);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-submit {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      border: 2px solid rgba(100, 200, 255, 0.6);
      font-size: 15px;
      background-color: rgba(100, 200, 255, 0.05);
      border-radius: 100px;
      font-weight: 600;
      color: #64c8ff;
      box-shadow: 0 0 0 2px rgba(100, 200, 255, 0.2);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      flex: 1;
    }

    .btn-submit::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background-color: rgba(100, 200, 255, 0.4);
      border-radius: 50%;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .btn-submit:hover {
      box-shadow: 0 0 0 12px transparent;
      color: #1a1a1a;
      border-color: #64c8ff;
      border-radius: 12px;
      background-color: rgba(100, 200, 255, 0.3);
    }

    .btn-submit:hover::before {
      width: 220px;
      height: 220px;
      opacity: 1;
    }

    .btn-submit:active {
      scale: 0.95;
      box-shadow: 0 0 0 4px rgba(100, 200, 255, 0.6);
    }

    .btn-clear {
      padding: 14px 28px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #999;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .btn-clear:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #c0c0c0;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn-clear:active {
      scale: 0.95;
    }

    .loading {
      display: none;
      text-align: center;
      margin: 40px 0;
    }

    .loader {
      --main-size: 2.5em;
      --text-color: #64c8ff;
      --shine-color: #64c8ff40;
      --shadow-color: #aaaaaa;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
      position: relative;
      font-size: var(--main-size);
      font-weight: 900;
      text-transform: uppercase;
      color: var(--text-color);
      width: 7.3em;
      height: 1em;
      filter: drop-shadow(0 0 0.05em var(--shine-color));
      margin: 0 auto 15px;
    }

    .loader .text {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      position: absolute;
    }

    .loader .text:nth-child(1) {
      clip-path: polygon(0% 0%, 11.11% 0%, 11.11% 100%, 0% 100%);
      font-size: calc(var(--main-size) / 20);
      margin-left: -2.1em;
      opacity: 0.6;
    }

    .loader .text:nth-child(2) {
      clip-path: polygon(11.11% 0%, 22.22% 0%, 22.22% 100%, 11.11% 100%);
      font-size: calc(var(--main-size) / 16);
      margin-left: -0.98em;
      opacity: 0.7;
    }

    .loader .text:nth-child(3) {
      clip-path: polygon(22.22% 0%, 33.33% 0%, 33.33% 100%, 22.22% 100%);
      font-size: calc(var(--main-size) / 13);
      margin-left: -0.33em;
      opacity: 0.8;
    }

    .loader .text:nth-child(4) {
      clip-path: polygon(33.33% 0%, 44.44% 0%, 44.44% 100%, 33.33% 100%);
      font-size: calc(var(--main-size) / 11);
      margin-left: -0.05em;
      opacity: 0.9;
    }

    .loader .text:nth-child(5) {
      clip-path: polygon(44.44% 0%, 55.55% 0%, 55.55% 100%, 44.44% 100%);
      font-size: calc(var(--main-size) / 10);
      margin-left: 0em;
      opacity: 1;
    }

    .loader .text:nth-child(6) {
      clip-path: polygon(55.55% 0%, 66.66% 0%, 66.66% 100%, 55.55% 100%);
      font-size: calc(var(--main-size) / 11);
      margin-left: 0.05em;
      opacity: 0.9;
    }

    .loader .text:nth-child(7) {
      clip-path: polygon(66.66% 0%, 77.77% 0%, 77.77% 100%, 66.66% 100%);
      font-size: calc(var(--main-size) / 13);
      margin-left: 0.33em;
      opacity: 0.8;
    }

    .loader .text:nth-child(8) {
      clip-path: polygon(77.77% 0%, 88.88% 0%, 88.88% 100%, 77.77% 100%);
      font-size: calc(var(--main-size) / 16);
      margin-left: 0.98em;
      opacity: 0.7;
    }

    .loader .text:nth-child(9) {
      clip-path: polygon(88.88% 0%, 100% 0%, 100% 100%, 88.88% 100%);
      font-size: calc(var(--main-size) / 20);
      margin-left: 2.1em;
      opacity: 0.6;
    }

    .loader .text span {
      animation: scrolling 2s cubic-bezier(0.1, 0.6, 0.9, 0.4) infinite, shadow 2s cubic-bezier(0.1, 0.6, 0.9, 0.4) infinite;
    }

    .loader .text:nth-child(1) span {
      background: linear-gradient(to right, var(--text-color) 4%, var(--shadow-color) 7%);
      background-size: 200% auto;
      background-clip: text;
      color: transparent;
    }

    .loader .text:nth-child(2) span {
      background: linear-gradient(to right, var(--text-color) 9%, var(--shadow-color) 13%);
      background-size: 200% auto;
      background-clip: text;
      color: transparent;
    }

    .loader .text:nth-child(3) span {
      background: linear-gradient(to right, var(--text-color) 15%, var(--shadow-color) 18%);
      background-size: 200% auto;
      background-clip: text;
      color: transparent;
    }

    .loader .text:nth-child(4) span {
      background: linear-gradient(to right, var(--text-color) 20%, var(--shadow-color) 23%);
      background-size: 200% auto;
      background-clip: text;
      color: transparent;
    }

    .loader .text:nth-child(6) span {
      background: linear-gradient(to right, var(--shadow-color) 29%, var(--text-color) 32%);
      background-size: 200% auto;
      background-clip: text;
      color: transparent;
    }

    .loader .text:nth-child(7) span {
      background: linear-gradient(to right, var(--shadow-color) 34%, var(--text-color) 37%);
      background-size: 200% auto;
      background-clip: text;
      color: transparent;
    }

    .loader .text:nth-child(8) span {
      background: linear-gradient(to right, var(--shadow-color) 39%, var(--text-color) 42%);
      background-size: 200% auto;
      background-clip: text;
      color: transparent;
    }

    .loader .text:nth-child(9) span {
      background: linear-gradient(to right, var(--shadow-color) 45%, var(--text-color) 48%);
      background-size: 200% auto;
      background-clip: text;
      color: transparent;
    }

    .loader .line {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      height: 0.05em;
      width: calc(var(--main-size) / 2);
      margin-top: 0.9em;
      border-radius: 0.05em;
    }

    .loader .line::before {
      content: "";
      position: absolute;
      height: 100%;
      width: 100%;
      background-color: var(--text-color);
      opacity: 0.3;
    }

    .loader .line::after {
      content: "";
      position: absolute;
      height: 100%;
      width: 100%;
      background-color: var(--text-color);
      border-radius: 0.05em;
      transform: translateX(-90%);
      animation: wobble 2s cubic-bezier(0.5, 0.8, 0.5, 0.2) infinite;
    }

    @keyframes wobble {
      0% { transform: translateX(-90%); }
      50% { transform: translateX(90%); }
      100% { transform: translateX(-90%); }
    }

    @keyframes scrolling {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes shadow {
      0% { background-position: -98% 0; }
      100% { background-position: 102% 0; }
    }

    .error-message {
      background: rgba(255, 50, 50, 0.1);
      color: #ff6666;
      padding: 16px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
      border-left: 4px solid #ff6666;
      border: 2px solid rgba(255, 100, 100, 0.3);
    }

    .results-section {
      margin-top: 30px;
      display: none;
    }

    .results-title {
      color: #64c8ff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(100, 200, 255, 0.3);
      letter-spacing: 0.5px;
    }

    .summary-box {
      background: linear-gradient(135deg, rgba(100, 200, 255, 0.05) 0%, rgba(100, 150, 255, 0.02) 100%);
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 30px;
      border: 1px solid rgba(100, 200, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    .summary-stat {
      display: inline-block;
      margin-right: 40px;
      margin-bottom: 15px;
    }

    .stat-label {
      color: #999;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .stat-value {
      color: #64c8ff;
      font-size: 28px;
      font-weight: 700;
    }

    .hierarchies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .hierarchy-card {
      background: linear-gradient(135deg, rgba(100, 200, 255, 0.05) 0%, rgba(50, 100, 150, 0.02) 100%);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(100, 200, 255, 0.2);
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      backdrop-filter: blur(10px);
    }

    .hierarchy-card:hover {
      border-color: rgba(100, 200, 255, 0.4);
      box-shadow: 0 8px 32px rgba(100, 200, 255, 0.1);
      transform: translateY(-4px);
    }

    .hierarchy-card.cycle {
      border-color: rgba(255, 100, 100, 0.2);
      background: linear-gradient(135deg, rgba(255, 100, 100, 0.05) 0%, rgba(150, 50, 50, 0.02) 100%);
    }

    .hierarchy-card.cycle:hover {
      border-color: rgba(255, 100, 100, 0.4);
      box-shadow: 0 8px 32px rgba(255, 100, 100, 0.1);
    }

    .card-header {
      font-weight: 700;
      color: #e8e8e8;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .card-root {
      font-size: 20px;
      color: #64c8ff;
      font-weight: 700;
    }

    .card-root.cycle {
      color: #ff8080;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-tree {
      background: rgba(100, 200, 255, 0.2);
      color: #64c8ff;
      border: 1px solid rgba(100, 200, 255, 0.4);
    }

    .badge-cycle {
      background: rgba(255, 100, 100, 0.2);
      color: #ff8080;
      border: 1px solid rgba(255, 100, 100, 0.4);
    }

    .depth-info {
      color: #999;
      font-size: 13px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tree-structure {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      max-height: 220px;
      overflow-y: auto;
      color: #64c8ff;
      line-height: 1.6;
      border: 1px solid rgba(100, 200, 255, 0.1);
    }

    .invalid-section {
      background: linear-gradient(135deg, rgba(255, 100, 100, 0.08) 0%, rgba(150, 50, 50, 0.03) 100%);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 100, 100, 0.2);
      backdrop-filter: blur(10px);
    }

    .invalid-title {
      color: #ff8080;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .invalid-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .invalid-item {
      background: rgba(255, 100, 100, 0.15);
      padding: 8px 14px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #ff8080;
      border: 1px solid rgba(255, 100, 100, 0.3);
    }

    .duplicate-section {
      background: linear-gradient(135deg, rgba(255, 180, 100, 0.08) 0%, rgba(150, 100, 50, 0.03) 100%);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 180, 100, 0.2);
      backdrop-filter: blur(10px);
    }

    .duplicate-title {
      color: #ffb464;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .duplicate-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .duplicate-item {
      background: rgba(255, 180, 100, 0.15);
      padding: 8px 14px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #ffb464;
      border: 1px solid rgba(255, 180, 100, 0.3);
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .hierarchies-grid {
        grid-template-columns: 1fr;
      }

      .summary-stat {
        display: block;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌳 HIERARCHY BUILDER</h1>
    <p class="subtitle">Process and visualize hierarchical relationships with advanced analytics</p>

    <div class="input-section">
      <label for="input">📝 Enter Node Relationships</label>
      <textarea id="input" placeholder="Example: A->B, A->C, B->D, C->E, E->F, X->Y, Y->Z, Z->X"></textarea>
      <div class="button-group">
        <button class="btn-submit" onclick="submitData()">SUBMIT</button>
        <button class="btn-clear" onclick="clearData()">CLEAR</button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="loader">
        <div class="text"><span>L</span></div>
        <div class="text"><span>O</span></div>
        <div class="text"><span>A</span></div>
        <div class="text"><span>D</span></div>
        <div class="text"><span>I</span></div>
        <div class="text"><span>N</span></div>
        <div class="text"><span>G</span></div>
        <div class="text"><span>.</span></div>
        <div class="text"><span>.</span></div>
        <div class="line"></div>
      </div>
      <p style="color: #999; margin-top: 10px;">Processing your hierarchies...</p>
    </div>

    <div class="error-message" id="error"></div>

    <div class="results-section" id="results">
      <div class="results-title">✨ ANALYSIS RESULTS</div>

      <div class="summary-box" id="summary"></div>

      <div id="invalidSection"></div>
      <div id="duplicateSection"></div>

      <div id="hierarchiesContainer"></div>
    </div>
  </div>

  <script>
    // Auto-detect environment or use hardcoded production URL
    const API_URL = window.location.hostname === 'localhost' 
      ? 'http://localhost:3000' 
      : 'https://bfhl-backend.onrender.com'; // UPDATE THIS with your Render URL

    async function submitData() {
      const input = document.getElementById('input').value.trim();
      const errorDiv = document.getElementById('error');
      const resultsDiv = document.getElementById('results');

      if (!input) {
        errorDiv.textContent = '⚠️ Please enter some data';
        errorDiv.style.display = 'block';
        resultsDiv.style.display = 'none';
        return;
      }

      errorDiv.style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        const data = input.split(',').map(item => item.trim());

        const res = await fetch(`${API_URL}/bfhl`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ data: data })
        });

        if (!res.ok) {
          throw new Error(`Server error: ${res.status}`);
        }

        const response = await res.json();
        displayResults(response);
        resultsDiv.style.display = 'block';
      } catch (err) {
        errorDiv.textContent = `❌ Error: ${err.message}. Make sure the API is running at ${API_URL}`;
        errorDiv.style.display = 'block';
        resultsDiv.style.display = 'none';
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function displayResults(response) {
      // Display summary
      const summaryBox = document.getElementById('summary');
      summaryBox.innerHTML = `
        <div class="summary-stat">
          <div class="stat-label">Total Trees</div>
          <div class="stat-value">${response.summary.total_trees}</div>
        </div>
        <div class="summary-stat">
          <div class="stat-label">Total Cycles</div>
          <div class="stat-value">${response.summary.total_cycles}</div>
        </div>
        <div class="summary-stat">
          <div class="stat-label">Largest Tree Root</div>
          <div class="stat-value">${response.summary.largest_tree_root || '—'}</div>
        </div>
      `;

      // Display invalid entries
      const invalidSection = document.getElementById('invalidSection');
      if (response.invalid_entries.length > 0) {
        invalidSection.innerHTML = `
          <div class="invalid-section">
            <div class="invalid-title">⚠️ Invalid Entries (${response.invalid_entries.length})</div>
            <div class="invalid-list">
              ${response.invalid_entries.map(item => `<span class="invalid-item">${item}</span>`).join('')}
            </div>
          </div>
        `;
      } else {
        invalidSection.innerHTML = '';
      }

      // Display duplicate edges
      const duplicateSection = document.getElementById('duplicateSection');
      if (response.duplicate_edges.length > 0) {
        duplicateSection.innerHTML = `
          <div class="duplicate-section">
            <div class="duplicate-title">⚡ Duplicate Edges (${response.duplicate_edges.length})</div>
            <div class="duplicate-list">
              ${response.duplicate_edges.map(item => `<span class="duplicate-item">${item}</span>`).join('')}
            </div>
          </div>
        `;
      } else {
        duplicateSection.innerHTML = '';
      }

      // Display hierarchies
      const hierarchiesContainer = document.getElementById('hierarchiesContainer');
      hierarchiesContainer.innerHTML = `<div class="results-title" style="margin-top: 30px;">🔗 Hierarchies (${response.hierarchies.length})</div>`;

      const gridDiv = document.createElement('div');
      gridDiv.className = 'hierarchies-grid';

      for (const hierarchy of response.hierarchies) {
        const card = document.createElement('div');
        card.className = `hierarchy-card ${hierarchy.has_cycle ? 'cycle' : ''}`;

        let content = `
          <div class="card-header">
            <span>Root: <span class="card-root ${hierarchy.has_cycle ? 'cycle' : ''}">${hierarchy.root}</span></span>
            <span class="badge ${hierarchy.has_cycle ? 'badge-cycle' : 'badge-tree'}">
              ${hierarchy.has_cycle ? '🔄 CYCLE' : '🌳 TREE'}
            </span>
          </div>
        `;

        if (hierarchy.has_cycle) {
          content += '<div style="color: #ff8080; font-size: 14px; margin-top: 8px;">This hierarchy contains a cycle</div>';
        } else {
          content += `<div class="depth-info">📊 Depth: <strong>${hierarchy.depth}</strong></div>`;
          content += `<div class="tree-structure">${formatTree(hierarchy.tree)}</div>`;
        }

        card.innerHTML = content;
        gridDiv.appendChild(card);
      }

      hierarchiesContainer.appendChild(gridDiv);
    }

    function formatTree(tree, indent = '') {
      let result = '';
      for (const key of Object.keys(tree).sort()) {
        result += indent + '├─ ' + key + '\n';
        const children = tree[key];
        if (Object.keys(children).length > 0) {
          result += formatTree(children, indent + '│  ');
        }
      }
      return result || 'Empty';
    }

    function clearData() {
      document.getElementById('input').value = '';
      document.getElementById('results').style.display = 'none';
      document.getElementById('error').style.display = 'none';
    }

    // Allow Ctrl+Enter to submit
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('input').addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
          submitData();
        }
      });
    });
  </script>
</body>
</html>
